<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attention — Modern Clock to increase productivity</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="loading-container loading">
    <div class="loading-icon">
      <img src="https://img.icons8.com/?size=100&id=6UucmpN78Ig0&format=png&color=111111" alt="">
    </div>
  </div>
  <div class="layout">

    <div class="controls">
      <div class="menus">
        <div class="container" id="toggle-controls-menu">
          <div class="titles">
            <p>settings</p>
          </div>
          <div class="rows">
            <div class="row">
              <p>primary lines</p>
              <div class="checkbox lines enabled" id="hours-lines" onclick="((e) => enableCheckbox(e))(this)">
                <div class="dot">
                </div>
              </div>
            </div>
            <div class="row">
              <p>secondary lines</p>
              <div class="checkbox lines enabled" id="mins-lines" onclick="((e) => enableCheckbox(e))(this)">
                <div class="dot">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="container" id="toggle-times-menu">
          <div class="titles">
            <p>timer</p>
          </div>
          <div class="rows">
            <div class="row">
              <p>focus time</p>
              <div class="select">
                <div class="button" id="focus-time" onclick="((e) => increaseTime(e))(this)">+</div>
                <div class="indicator" id="focus-time">
                  <p>25mins</p>
                </div>
                <div class="button" id="focus-time" onclick="((e) => decreaseTime(e))(this)">-</div>
              </div>
            </div>
            <div class="row">
              <p>rest time</p>
              <div class="select">
                <div class="button" id="break-time" onclick="((e) => increaseTime(e))(this)">+</div>
                <div class="indicator" id="break-time">
                  <p>5mins</p>
                </div>
                <div class="button" id="break-time" onclick="((e) => decreaseTime(e))(this)">-</div>
              </div>
            </div>
            <div class="row">
              <div class="buttons">
                <div class="button" id="focus" onclick="(() => toggleFocus())()">
                  <p>focus</p>
                </div>
                <div class="button">
                  <p>break</p>
                </div>
                <!-- <div class="button">
                  <p>stop</p>
                </div> -->
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="buttons">
        <div class="button" id="toggle-controls-menu" onclick="((e) => toggleControlMenu(e))(this)">
          <img src="https://img.icons8.com/?size=100&id=4511GGVppfIx&format=png&color=eeeeee" alt="">
        </div>
        <div class="button" id="toggle-times-menu" onclick="((e) => toggleControlMenu(e))(this)">
          <img src="https://img.icons8.com/?size=100&id=G9JqmoUherxM&format=png&color=eeeeee" alt="">
        </div>
      </div>
    </div>
    <div class="clock">
      <div class="pin"></div>
      <div class="hours-lines enabled">
        <!-- <div class="line" style="--h-position: 0"></div> -->
      </div>
      <div class="mins-lines enabled">
        <!-- <div class="line" style="--m-position: 0"></div> -->
      </div>
      <div class="arrows">
        <div class="arrow" id="h"></div>
        <div class="arrow" id="m"></div>
        <div class="arrow" id="s"></div>
      </div>
    </div>
  </div>
</body>
<script src="app.js"></script>

</html>
